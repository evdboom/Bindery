name: Dependabot auto-approve and merge

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  dependabot:
    name: Auto-approve & enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.sender.login == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verify and approve protected Dependabot branch
        id: verify
        uses: actions/github-script@v9
        with:
          script: |
            const { verifyAndApprove } = require('./scripts/dependabot-auto-approve.cjs');
            const sha = await verifyAndApprove({ github, context });
            core.setOutput('sha', sha);

      - name: Enable auto-merge for verified head
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          HEAD_SHA: ${{ steps.verify.outputs.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
